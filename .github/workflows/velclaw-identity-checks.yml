name: Velclaw Identity checks

on:
  pull_request:
    paths:
      - "velclaw-identity/**"
      - ".github/workflows/velclaw-identity-checks.yml"
  push:
    branches:
      - main
      - "chore/extract-velclaw-identity"
    paths:
      - "velclaw-identity/**"
      - ".github/workflows/velclaw-identity-checks.yml"

permissions:
  contents: read

concurrency:
  group: identity-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velclaw-identity
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Deno
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://deno.land/install.sh -o /tmp/install-deno.sh
          sh /tmp/install-deno.sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version

      - name: Type-check application and backend
        run: deno task check

      - name: Run JWT security tests
        run: deno task test
